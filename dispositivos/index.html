<!DOCTYPE html>
<html lang="es" data-kmode="light" data-ktheme="taisared">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#090d13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dispositivos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<title>Anubis · Registro de máquinas y dispositivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<script>(function(){try{
  var m='light',t='taisared';
  try{m=localStorage.getItem('taisa_mode_pick')||'light';t=localStorage.getItem('taisa_theme_pick')||'taisared';}catch(e){}
  var OK={indigo:['dark'],lmgreen:['dark','light'],taisared:['dark','light'],amber:['dark'],retro80s:['dark','light']};
  if(m!=='dark')m='light';
  if(!OK[t]||OK[t].indexOf(m)===-1)t='taisared';
  document.documentElement.setAttribute('data-kmode',m);
  document.documentElement.setAttribute('data-ktheme',t);
}catch(e){}})();</script>
<style>
/* ============================================================
   Diseño Taisa: el mismo sistema que RYU y Kairos (tokens ink/text/acento, modo claro/oscuro × acento,
   tarjetas con degradado y borde de color, botones premium de 46 px, pestañas con icono, modales propios).
   Los tokens son los de RYU/Estilos.html; las mismas claves de tema (taisa_mode_pick / taisa_theme_pick)
   que usa «Registro de incidencias», así que el tema elegido en una vale para la otra.
   ============================================================ */
:root{
  color-scheme:dark;
  --ink-950:#090d13;--ink-900:#0f151e;--ink-850:#141b26;--ink-800:#1a2230;--ink-700:#28323f;--ink-600:#3a4757;
  --text-100:#eef2f7;--text-300:#c3ccd8;--text-500:#8b97a8;--text-600:#66707e;
  --ok:#34d17a;--ok-ink:#062b12;--ok-bg:#0e2a1a;--ok-fg:#7fe0a4;--ok-line:#1f6b40;
  --warn-bg:#4a2c0b;--warn-fg:#ffcd8a;--warn-line:#7a4a15;
  --danger-bg:#3a1414;--danger-fg:#ffb0ab;--danger-line:#7a2a24;
  --info-bg:#12213f;--info-fg:#8fb2ff;--info-line:#2b4a8a;
  --chip-marbella-bg:#12213f;--chip-marbella-fg:#8fb2ff;
  --chip-mijas-bg:#26123b;--chip-mijas-fg:#d6a6ff;
  --chip-malaga-bg:#0f2a1a;--chip-malaga-fg:#7fe0a4;
  --chip-granada-bg:#3a1424;--chip-granada-fg:#fda4af;
  --radius-card:14px;--radius-btn:12px;--radius-chip:999px;
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --accent:#FF1493;--accent-ink:#ffffff;--accent-dim:#3a0f28;--accent-line:#a80f5c;--accent-deep:#b00e68;
  --accent-glow:rgba(255,20,147,.38);--accent-soft:rgba(255,20,147,.18);--accent-text:var(--accent);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-brand:'Permanent Marker',cursive;
}
[data-kmode="light"]{
  color-scheme:light;
  --ink-950:#f6f4f1;--ink-900:#ffffff;--ink-850:#fbfaf8;--ink-800:#e8e4de;--ink-700:#d7d2ca;--ink-600:#b6afa4;
  --text-100:#201f1c;--text-300:#4a473f;--text-500:#7a7568;--text-600:#8a8574;
  --ok:#1a8f4c;--ok-ink:#eafff2;--ok-bg:#e2f6e9;--ok-fg:#14683a;--ok-line:#9fd9b5;
  --warn-bg:#fff1d6;--warn-fg:#92400e;--warn-line:#f0c878;
  --danger-bg:#fde7e5;--danger-fg:#b91c1c;--danger-line:#f4b3ac;
  --info-bg:#e5edff;--info-fg:#1d4ed8;--info-line:#b5c8f5;
  --chip-marbella-bg:#e5edff;--chip-marbella-fg:#1d4ed8;
  --chip-mijas-bg:#f2e6ff;--chip-mijas-fg:#7e22ce;
  --chip-malaga-bg:#e2f6e9;--chip-malaga-fg:#15803d;
  --chip-granada-bg:#ffe4e6;--chip-granada-fg:#be123c;
  --shadow-card:0 1px 2px rgba(30,25,15,.04),0 10px 24px -14px rgba(30,25,15,.18);
  --accent-text:var(--accent-deep);
}
[data-ktheme="indigo"]  {--accent:#4c7dff;--accent-ink:#ffffff;--accent-dim:#1c2b52;--accent-line:#3a55a8;--accent-deep:#3459c4;--accent-glow:rgba(76,125,255,.38);--accent-soft:rgba(76,125,255,.20);--accent-text:#7a9cff}
[data-ktheme="lmgreen"] {--accent:#3fb54a;--accent-ink:#04220a;--accent-dim:#123420;--accent-line:#2f7a3c;--accent-deep:#35a042;--accent-glow:rgba(63,181,74,.36);--accent-soft:rgba(63,181,74,.20)}
[data-ktheme="taisared"]{--accent:#e2263a;--accent-ink:#ffffff;--accent-dim:#3a1216;--accent-line:#8a2530;--accent-deep:#a81a2a;--accent-glow:rgba(226,38,58,.38);--accent-soft:rgba(226,38,58,.20);--accent-text:#ff5468}
[data-ktheme="amber"]   {--accent:#f0a020;--accent-ink:#241400;--accent-dim:#3a2708;--accent-line:#93672a;--accent-deep:#c47e0c;--accent-glow:rgba(240,160,32,.36);--accent-soft:rgba(240,160,32,.20)}
[data-ktheme="retro80s"]{--accent:#FF1493;--accent-ink:#ffffff;--accent-dim:#3a0f28;--accent-line:#a80f5c;--accent-deep:#b00e68;--accent-glow:rgba(255,20,147,.38);--accent-soft:rgba(255,20,147,.18)}
[data-kmode="light"][data-ktheme="lmgreen"] {--accent:#2f9e3f;--accent-ink:#ffffff;--accent-dim:#e4f5e7;--accent-line:#a9dab4;--accent-deep:#217a2f;--accent-glow:rgba(47,158,63,.30);--accent-soft:rgba(47,158,63,.16);--accent-text:#217a2f}
[data-kmode="light"][data-ktheme="taisared"]{--accent:#dc1a23;--accent-ink:#ffffff;--accent-dim:#fde6e6;--accent-line:#f0aaac;--accent-deep:#a8121a;--accent-glow:rgba(220,26,35,.30);--accent-soft:rgba(220,26,35,.14);--accent-text:#a8121a}
[data-kmode="light"][data-ktheme="retro80s"]{--accent:#d6127a;--accent-ink:#ffffff;--accent-dim:#ffe0f0;--accent-line:#ffb3d9;--accent-deep:#9d0c5a;--accent-glow:rgba(214,18,122,.30);--accent-soft:rgba(214,18,122,.14);--accent-text:#9d0c5a}


*{box-sizing:border-box}
html,body{background:var(--ink-950)}
body{margin:0;padding:14px 14px calc(40px + env(safe-area-inset-bottom));color:var(--text-100);font-family:var(--font);-webkit-font-smoothing:antialiased;transition:background .15s ease,color .15s ease}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
button,input,select,textarea{font-family:inherit}
h1{font-size:19px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-500);margin:18px 0 8px}
.oculto{display:none!important}
.mono{font-variant-numeric:tabular-nums}
.solo-lectores{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;vertical-align:-3px}
#app{max-width:520px;margin:0 auto}
@media (min-width:760px){#app{max-width:860px}}
@media (min-width:1100px){#app{max-width:1180px}}

/* ——— cabecera ——— */
.brand-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:12px}
.brand-badge{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);
  background:linear-gradient(180deg,var(--accent) 0%,var(--accent-deep) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px -8px var(--accent-glow)}
.brand-badge svg.i{width:26px;height:26px}
[data-ktheme="retro80s"] .brand-head{padding-top:16px;position:relative}
[data-ktheme="retro80s"] .brand-head::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:3px;
  background:linear-gradient(135deg,#FF1493 0%,#FF1493 20%,#00C5B5 20%,#00C5B5 40%,#3B2F85 40%,#3B2F85 60%,#FFD700 60%,#FFD700 80%,#FF2400 80%,#FF2400 100%)}
.brand-titulo{flex:1 1 180px;min-width:0}
.brand-nombre{font-family:var(--font-brand);font-size:30px;line-height:1.05;color:var(--text-100);margin:0}
.brand-sub{font-size:12.5px;color:var(--text-500);margin-top:3px}
.brand-acciones{display:flex;align-items:center;gap:8px}
.estado-sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:var(--radius-chip);background:var(--ink-800);color:var(--text-300);white-space:nowrap}
.estado-sync.ok{color:var(--ok)}
.estado-sync.mal{color:var(--danger-fg);background:var(--danger-bg)}
.estado-sync.trabajando{color:var(--info-fg);background:var(--info-bg)}

/* ——— pestañas ——— */
.tabs{display:flex;background:var(--ink-900);border:1px solid var(--ink-800);border-radius:var(--radius-card);padding:4px;margin-bottom:12px;gap:2px;position:sticky;top:6px;z-index:30;box-shadow:var(--shadow-card)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;border-radius:calc(var(--radius-card) - 4px);
  border:0;background:transparent;color:var(--text-500);font-size:11px;font-weight:700;min-height:48px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabs button svg.i{width:20px;height:20px}
.tabs button.activa{background:var(--accent-dim);color:var(--accent-text)}
.badge-tab{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#2563eb;color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center}

/* ——— botones ——— */
.btn{cursor:pointer;border:0;border-radius:var(--radius-btn);padding:11px 16px;min-height:46px;font-size:14px;font-weight:800;color:var(--accent-ink);
  background:linear-gradient(180deg,var(--accent) 0%,var(--accent-deep) 100%);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px -8px var(--accent-glow),0 1px 2px rgba(14,22,33,.18);
  transition:filter .16s,box-shadow .16s,transform .12s}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(1.07)}}
.btn:active{transform:scale(.97);filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.grande{min-height:56px;font-size:16px;width:100%}
.btn.secundario{background:var(--ink-800);color:var(--text-300);box-shadow:none}
.btn.borde{background:var(--ink-900);color:var(--text-100);border:1px solid var(--ink-700);box-shadow:none}
.btn.peligro{background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger-line);box-shadow:none}
.btn.ok{background:var(--ok);color:var(--ok-ink);box-shadow:none}
.btn.mini{min-height:38px;padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.ancho{width:100%}
.fila-botones{display:flex;gap:8px;flex-wrap:wrap}
.fila-botones>.btn{flex:1 1 130px}

/* ——— tarjetas ——— */
.tarjeta{background:linear-gradient(160deg,var(--ink-850) 0%,var(--ink-900) 100%);border:1px solid var(--ink-800);border-top:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius-card);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow-card)}
[data-kmode="light"] .tarjeta{background:var(--ink-900);border-top-color:var(--ink-800)}
.tarjeta.borde-acento{border-left:4px solid var(--accent)}
.tarjeta.borde-ok{border-left:4px solid var(--ok)}
.tarjeta.borde-aviso{border-left:4px solid #f0a020}
.tarjeta.borde-mal{border-left:4px solid #e5322d}
.tarjeta.clic{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tarjeta.clic:active{transform:scale(.985)}
.tarjeta-cabecera{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.etiqueta{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text-500)}
.valor-grande{font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
.meta{color:var(--text-500);font-size:12.5px}
.nombre{font-size:16.5px;font-weight:900;letter-spacing:-.005em;overflow-wrap:anywhere}

/* ——— chips y piezas pequeñas ——— */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:var(--radius-chip);white-space:nowrap;background:var(--ink-800);color:var(--text-300)}
.chip svg.i{width:14px;height:14px;vertical-align:-2px}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)}
.chip.aviso{background:var(--warn-bg);color:var(--warn-fg)}
.chip.mal{background:var(--danger-bg);color:var(--danger-fg)}
.chip.info{background:var(--info-bg);color:var(--info-fg)}
.chip.acento{background:var(--accent-dim);color:var(--accent-text)}
.pick{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 14px;border-radius:999px;background:var(--ink-850);border:1px solid var(--ink-700);color:var(--text-300);font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pick .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
.pick[data-for="indigo"] .dot{background:#4c7dff}.pick[data-for="lmgreen"] .dot{background:#3fb54a}.pick[data-for="taisared"] .dot{background:#e2263a}.pick[data-for="amber"] .dot{background:#f0a020}
.pick[data-for="retro80s"] .dot{background:linear-gradient(135deg,#FF1493 0%,#FF1493 20%,#00C5B5 20%,#00C5B5 40%,#3B2F85 40%,#3B2F85 60%,#FFD700 60%,#FFD700 80%,#FF2400 80%,#FF2400 100%)}
.pick.active,.pick[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent-text)}
.pick[data-hidden]{display:none}
.fila-picks{display:flex;flex-wrap:wrap;gap:8px}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .pick{flex:none}

/* ——— formularios ——— */
label.campo{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text-500);margin:0 0 5px}
.grupo-campo{margin-bottom:12px}
input[type=text],input[type=search],input[type=password],input[type=date],select,textarea{width:100%;font-size:16px;padding:12px 13px;background:var(--ink-950);border:1px solid var(--ink-700);border-radius:var(--radius-btn);color:var(--text-100);outline:none;min-height:46px}
textarea{min-height:120px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--text-600)}
.buscador{position:relative;margin-bottom:10px}
.buscador svg.i{position:absolute;left:13px;top:14px;color:var(--text-500);pointer-events:none}
.buscador input{padding-left:40px}
.rejilla-filtros{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rejilla-filtros>*{min-width:0}
input[type=date]{min-width:0;max-width:100%}
@media (min-width:760px){.rejilla-filtros{grid-template-columns:repeat(5,minmax(0,1fr))}}
.rejilla-filtros .ancho2{grid-column:1 / -1}
@media (min-width:760px){.rejilla-filtros .ancho2{grid-column:auto}}

/* ——— listas ——— */
.rejilla{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.rejilla{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.rejilla{grid-template-columns:repeat(3,1fr)}}
.rejilla .tarjeta{margin-bottom:0;display:flex;flex-direction:column}
.rejilla .tarjeta .fila-botones{margin-top:auto;padding-top:12px}
.estado-linea{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 0;font-size:14px;font-weight:700}
.secciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.seccion{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:104px;padding:14px 16px;border-radius:20px;border:2px solid var(--ink-700);background:var(--ink-850);color:var(--text-300);font-family:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s;min-width:0}
.seccion:active{transform:scale(.97)}
.seccion svg.i{width:30px;height:30px}
.seccion .sec-nombre{font-size:20px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
.seccion .sec-cuenta{font-size:12.5px;font-weight:700;opacity:.9}
.seccion .sec-marca{position:absolute;top:10px;right:10px;display:none}
.seccion .sec-marca svg.i{width:20px;height:20px}
.seccion[aria-checked="true"]{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-text);box-shadow:0 8px 20px -12px var(--accent-glow)}
.seccion[aria-checked="true"] .sec-marca{display:block}
.resumen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.resumen .tarjeta{margin-bottom:0;padding:12px 14px}
.resumen .tarjeta.activa{outline:2px solid var(--accent);outline-offset:-2px}
.vacio{text-align:center;color:var(--text-500);padding:28px 12px;font-size:14px}
.dia{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-500);margin:16px 2px 6px}
.mov{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;margin-bottom:8px}
.mov-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--accent-dim);color:var(--accent-text)}
.mov-ico.dejar{background:var(--ok-bg);color:var(--ok-fg)}
.mov-ico.auto{background:var(--info-bg);color:var(--info-fg)}
.mov-cuerpo{min-width:0;flex:1}
.mov-linea{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.mov-hora{font-size:12.5px;color:var(--text-500);font-variant-numeric:tabular-nums;white-space:nowrap}
.fila-aj{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px}
.fila-aj .cuerpo{flex:1;min-width:0}
.fila-aj .acciones{display:flex;gap:6px;flex:none}
.fila-aj .btn.mini{min-width:42px;padding:7px 10px}
.segmentos{display:flex;background:var(--ink-900);border:1px solid var(--ink-800);border-radius:var(--radius-btn);padding:3px;gap:2px;margin-bottom:12px}
.segmentos button{flex:1;border:0;background:transparent;color:var(--text-500);font-size:13px;font-weight:800;min-height:42px;border-radius:calc(var(--radius-btn) - 3px);cursor:pointer}
.segmentos button.activa{background:var(--accent-dim);color:var(--accent-text)}
.fila-titulo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.fila-titulo .fila-botones>.btn{flex:0 1 auto}

/* ——— tablero de cuadros ——— */
.titulo-grupo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 2px 10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-300)}
.titulo-grupo:first-child{margin-top:4px}
.titulo-grupo .chip{text-transform:none;letter-spacing:0}
.tablero{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:560px){.tablero{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.tablero{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1100px){.tablero{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cuadro{display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left;aspect-ratio:1/1;min-height:132px;padding:12px;border-radius:18px;border:2px solid;cursor:pointer;font-family:inherit;color:inherit;
  -webkit-tap-highlight-color:transparent;overflow:hidden;transition:transform .12s,filter .16s;min-width:0}
.cuadro:active{transform:scale(.96)}
@media (hover:hover){.cuadro:hover{filter:brightness(1.07)}}
.cuadro.libre{background:linear-gradient(160deg,var(--ok-bg) 0%,var(--ink-900) 120%);border-color:var(--ok-line);color:var(--ok-fg)}
.cuadro.uso{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-deep) 100%);border-color:var(--accent-line);color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px -10px var(--accent-glow)}
.cuadro.viejo{background:linear-gradient(180deg,#f0a020 0%,#c47e0c 100%);border-color:#93672a;color:#241400;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 20px -10px rgba(240,160,32,.5)}
.cuadro-top{display:flex;align-items:center;justify-content:space-between}
.cuadro-medio{flex:1 0 auto;min-width:0}
.cuadro-top svg.i{width:26px;height:26px;opacity:.92}
.cuadro-num{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.cuadro-num.largo{font-size:19px;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cuadro-nom{font-size:12px;line-height:1.25;font-weight:700;margin-top:4px;opacity:.88;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cuadro.libre .cuadro-nom{color:var(--text-300);opacity:1}
.cuadro-pie{display:flex;flex-direction:column;gap:1px;min-width:0}
.cuadro-estado{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:900;letter-spacing:.08em}
.cuadro-quien{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cuadro-desde{font-size:12px;font-weight:700;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cuadro-desde svg.i{width:13px;height:13px;vertical-align:-2px}
.barra{grid-column:1 / -1;height:10px;border-radius:6px;background:var(--ink-800);overflow:hidden;display:flex}
.barra .b-libre{background:var(--ok)}
.barra .b-uso{background:var(--accent)}
.fila-buscar{display:flex;gap:8px;margin-bottom:10px}
.fila-buscar .buscador{flex:1;margin:0;min-width:0}
.fila-buscar .segmentos{margin:0;flex:none}
.fila-buscar .segmentos button{flex:none;width:46px;min-height:44px;display:flex;align-items:center;justify-content:center}

/* ——— elegir persona ——— */
.grid-operarios{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.btn-operario{min-height:56px;border-radius:16px;border:2px solid var(--ink-700);background:var(--ink-900);color:var(--text-100);font-size:15px;font-weight:800;cursor:pointer;padding:8px 10px;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.btn-operario:active,.btn-operario.activo{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-text)}
.aviso-modal{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);border-radius:var(--radius-btn);padding:10px 12px;font-size:13.5px;line-height:1.4;margin:0 0 12px}
.cuadro-aviso{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#f0a020;color:#241400;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.cuadro-top .cuadro-aviso svg.i{width:17px;height:17px;opacity:1}
.banner-avisos{display:flex;align-items:flex-start;gap:8px;font-weight:700}
.banner-avisos svg.i{width:18px;height:18px;flex:none;margin-top:1px}
.tabs button.tab-candado{flex:0 0 auto;min-width:46px;padding-left:8px;padding-right:8px}
.badge-tab.aviso{background:#f0a020;color:#241400}
.pin-campo{text-align:center;font-size:30px;font-weight:900;letter-spacing:.5em;padding-left:.5em;font-variant-numeric:tabular-nums}
.titulo-seccion{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-300);margin:18px 2px 8px}
.aviso-texto{margin:6px 0 8px;font-weight:700;overflow-wrap:anywhere}
.aviso-modal.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info-fg)}
.error-modal{color:var(--danger-fg);background:var(--danger-bg);border:1px solid var(--danger-line);border-radius:var(--radius-btn);padding:9px 12px;font-size:13.5px;margin:0 0 10px}

/* ——— modales y avisos ——— */
.kback{position:fixed;inset:0;background:rgba(5,8,12,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:1000;overscroll-behavior:contain}
.kmodal{background:var(--ink-900);border:1px solid var(--ink-800);border-radius:var(--radius-card);padding:18px;max-width:440px;width:100%;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain}
.kmodal:focus{outline:none}
.kmodal h3{font-size:17px;font-weight:900;margin:0 0 4px}
.kmodal .sub-modal{margin:0 0 12px;font-size:13.5px;color:var(--text-500)}
.kmodal p{margin:0 0 14px;font-size:14.5px;line-height:1.45;color:var(--text-300)}
.kmodal .fila-botones{margin-top:10px;justify-content:flex-end}
.kmodal .fila-botones>.btn{flex:1 1 120px}
.kmodal-largo .fila-botones{position:sticky;bottom:-18px;z-index:2;margin:12px -18px -18px;padding:12px 18px 18px;background:var(--ink-900);border-top:1px solid var(--ink-800)}
body.modal-abierto{overflow:hidden}
.toasts{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1100;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:480px;width:100%;padding:12px 14px;border-radius:14px;background:var(--text-100);color:var(--ink-950);font-size:14px;font-weight:700;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
.toast.mal{background:#c81e1e;color:#fff}
.toast.ok{background:#14935a;color:#fff}
.toast span{flex:1}

/* ——— más de 8 horas sin devolver ——— */
.chip.exceso{background:#8f0f1f;color:#fff}
.cuadro.exceso{position:relative;background:linear-gradient(180deg,#9b1022 0%,#4d0711 100%);border-color:#ff4d5e;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 22px -8px rgba(229,50,45,.75)}
.cuadro.exceso::after{content:'';position:absolute;inset:0;border-radius:inherit;border:3px solid #ff6b78;pointer-events:none;animation:pulsoExceso 1.8s ease-in-out infinite}
.cuadro.exceso .cuadro-nom{color:#fff}
.cuadro-exceso{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#8f0f1f;font-size:12px;font-weight:900;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.cuadro-exceso svg.i{width:13px;height:13px;vertical-align:-2px}
@keyframes pulsoExceso{0%,100%{opacity:.25}50%{opacity:1}}
.banner-exceso{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 12px;padding:12px 14px;border-radius:16px;border:2px solid #ff4d5e;background:linear-gradient(180deg,#9b1022 0%,#5a0814 100%);color:#fff;font-family:inherit;font-size:14px;font-weight:800;line-height:1.35;cursor:pointer;-webkit-tap-highlight-color:transparent}
.banner-exceso svg.i{width:26px;height:26px;flex:none}
.banner-exceso:active{transform:scale(.985)}
.banner-exceso .ver{margin-left:auto;flex:none;font-size:12px;text-decoration:underline;white-space:nowrap}
.kmodal-exceso{border:3px solid #ff4d5e;box-shadow:0 0 0 6px rgba(255,77,94,.28),0 24px 60px -20px rgba(0,0,0,.7)}
.kmodal-exceso .exceso-cab{display:flex;flex-direction:column;align-items:center;gap:8px;margin:-18px -18px 14px;padding:22px 18px 16px;background:linear-gradient(180deg,#b3132a 0%,#6b0a18 100%);color:#fff;text-align:center;border-radius:calc(var(--radius-card) - 4px) calc(var(--radius-card) - 4px) 0 0}
.kmodal-exceso .exceso-cab svg.i{width:60px;height:60px;stroke-width:1.8;animation:pulsoIcono 1.4s ease-in-out infinite}
.kmodal-exceso .exceso-cab h3{font-size:23px;line-height:1.15;margin:0;color:#fff}
.kmodal-exceso .exceso-cab p{margin:0;font-size:13.5px;font-weight:700;color:#ffe3e6}
@keyframes pulsoIcono{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.exceso-item{border:2px solid #ff4d5e;background:rgba(229,50,45,.1);border-radius:16px;padding:12px 14px;margin:0 0 10px}
.exceso-quien{font-size:21px;font-weight:900;line-height:1.15}
.exceso-disp{font-size:15px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.exceso-tiempo{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:15px;font-weight:900;color:#ff6b78}
.exceso-tiempo svg.i{width:18px;height:18px}
.kmodal-exceso .fila-botones>.btn{min-height:56px;font-size:16px}

/* ——— cartel grande de 2 s al coger una máquina / soltar un móvil ——— */
.cartel{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,8,12,.74);cursor:pointer;-webkit-tap-highlight-color:transparent;opacity:1;transition:opacity .25s}
.cartel.sale{opacity:0}
.cartel-caja{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:420px;padding:34px 22px 30px;border-radius:28px;background:linear-gradient(180deg,#f6b73c 0%,#e0920f 100%);color:#241400;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.35);animation:cartelEntra .22s ease-out}
.cartel-caja svg.i{width:88px;height:88px;stroke-width:1.7}
.cartel-titulo{font-size:31px;font-weight:900;line-height:1.1;letter-spacing:-.015em}
.cartel-texto{font-size:16px;font-weight:800;opacity:.8}
@keyframes cartelEntra{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* ——— fuera de servicio, sin enviar, cierre de turno y estadísticas ——— */
.cuadro.fuera{background:repeating-linear-gradient(135deg,var(--ink-800) 0 12px,var(--ink-850) 12px 24px);border-color:var(--ink-600);border-style:dashed;color:var(--text-300)}
.cuadro.fuera .cuadro-nom{color:var(--text-300);opacity:1}
.cuadro-fuera{display:inline-flex;align-items:center;gap:4px;background:var(--text-300);color:var(--ink-950);font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.cuadro-pend{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:#2563eb;color:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35)}
ol.pasos{margin:0 0 6px;padding-left:22px;color:var(--text-300);font-size:14px;line-height:1.55}
ol.pasos li{margin:0 0 6px}
.cuadro-top .cuadro-fuera svg.i,.cuadro-top .cuadro-pend svg.i{width:13px;height:13px;vertical-align:-2px;opacity:1}
.chip.fuera{background:var(--ink-700);color:var(--text-100)}
.chip.pend{background:#2563eb;color:#fff}

/* ——— estados (con fallo, averiado, en reparación, baja) y pulsación larga ——— */
.cuadro{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cuadro.fallo{border-color:var(--warn-line)}
.cuadro-fallo{display:inline-flex;align-items:center;gap:4px;background:#f0a020;color:#241400;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.cuadro-top .cuadro-fallo svg.i{width:13px;height:13px;vertical-align:-2px;opacity:1}
.chip.fallo{background:#f0a020;color:#241400}
.tarjeta.borde-fallo{border-left:4px solid #f0a020}
.lista-estados{display:grid;gap:8px;margin:0 0 4px}
.op-estado{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--ink-600);background:var(--ink-850);color:var(--text-100);font-family:inherit;cursor:pointer;min-height:56px}
.op-estado svg.i{width:24px;height:24px;flex:none;margin-top:1px}
.op-estado b{display:block;font-size:16px;font-weight:900}
.op-estado span{display:block;font-size:13px;color:var(--text-300);margin-top:2px}
.op-estado.actual{border-color:var(--accent);background:var(--ink-800)}
.op-estado.fallo svg.i{color:#f0a020}.op-estado.averiado svg.i,.op-estado.reparacion svg.i,.op-estado.baja svg.i{color:var(--danger-fg)}.op-estado.operativo svg.i{color:var(--ok)}
.op-estado:active{transform:scale(.985)}
.pista-largo{margin:14px 0 0;text-align:center;font-size:12.5px;color:var(--text-500)}
.tarjeta.borde-fuera{border-left:4px solid var(--ink-600)}
.barra .b-fuera{background:var(--ink-600)}
.resumen.tres{grid-template-columns:1fr 1fr 1fr}
.resumen.tres .tarjeta{padding:10px 10px}
.resumen.tres .valor-grande{font-size:26px}
.resumen.tres .etiqueta{font-size:10.5px;letter-spacing:.04em}
.banner-cola{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-family:inherit;font-weight:700;cursor:pointer}
.banner-avisos svg.i,.banner-cola svg.i{width:18px;height:18px;flex:none}
.fila-cierre{margin:0 0 12px}
.fila-cierre .btn{width:100%}
.cierre-item{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--ink-700);background:var(--ink-850);border-radius:14px;padding:10px 12px;margin:0 0 8px}
.cierre-item.mio{border-color:var(--accent);background:var(--accent-dim)}
.cierre-datos{flex:1 1 160px;min-width:0}
.cierre-nombre{font-size:15px;font-weight:900;overflow-wrap:anywhere}
.cierre-quien{font-size:13px;font-weight:700;color:var(--text-300)}
.cierre-item .fila-btn-mini{display:flex;gap:6px;flex:none}
.est-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;margin:0 0 10px}
.est-nombre{font-weight:800;font-size:14px;overflow-wrap:anywhere}
.est-valor{font-size:12.5px;font-weight:700;color:var(--text-300);white-space:nowrap}
.est-barra{grid-column:1 / -1;height:8px;border-radius:5px;background:var(--ink-800);overflow:hidden}
.est-barra>span{display:block;height:100%;background:var(--accent)}
.est-barra.mal>span{background:#e5322d}
.est-horas{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;align-items:end;height:96px;margin-top:6px}
.est-horas>span{display:block;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px}
.est-horas>span.cero{background:var(--ink-700)}
.est-etiquetas{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;font-size:10px;font-weight:700;color:var(--text-500);text-align:center;margin-top:3px}
.est-etiquetas>span{white-space:nowrap}
.est-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.est-grid .tarjeta{margin-bottom:0;padding:12px 14px}
.est-grid .valor-grande{font-size:26px;overflow-wrap:anywhere}
@media (max-width:360px){.cuadro{aspect-ratio:auto;min-height:150px}.cuadro-estado{letter-spacing:.04em}.seccion{padding:12px}.seccion .sec-nombre{font-size:17px;overflow-wrap:anywhere}.est-grid .valor-grande{font-size:22px}}
.est-sub{font-size:11.5px;font-weight:700;color:var(--text-500);margin-top:2px}
.est-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.est-periodo{margin:0 2px 10px;font-size:12.5px;font-weight:700;color:var(--text-500)}
.tarjeta-instalar{margin-top:14px}
.tarjeta-instalar .fila-botones{margin-top:10px}
.toast.aviso{background:#f0a020;color:#241400}

/* ——— acceso ——— */
.acceso{max-width:420px;margin:8vh auto 0;text-align:center}
.acceso .brand-badge{margin:0 auto 14px}
.acceso p{color:var(--text-300);font-size:14.5px;line-height:1.45;margin:0 0 14px}
.acceso .grupo-campo{text-align:left}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    ]);

  // Pulsación larga (jefes): mantener pulsado un cuadro abre el menú de estados. El toque que llega al soltar el dedo no debe cerrar el
  // menú recién abierto ni pulsar el cuadro de debajo.
  var LARGA_MS = 600, SOLTANDO_LARGA = false;
  function conPulsacionLarga(btn, alLargo) {
    var timer = null, x0 = 0, y0 = 0, disparado = false;
    function parar() { if (timer) { clearTimeout(timer); timer = null; } }
    function soltar() {
      document.removeEventListener('pointerup', soltar, true);
      document.removeEventListener('pointercancel', soltar, true);
      setTimeout(function () { SOLTANDO_LARGA = false; }, 450);
    }
    btn.addEventListener('pointerdown', function (ev) {
      if (ev.button !== undefined && ev.button !== 0) return;
      disparado = false; x0 = ev.clientX; y0 = ev.clientY; parar();
      timer = setTimeout(function () {
        timer = null; disparado = true; SOLTANDO_LARGA = true;
        document.addEventListener('pointerup', soltar, true);
        document.addEventListener('pointercancel', soltar, true);
        try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
        alLargo();
      }, LARGA_MS);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { btn.addEventListener(n, parar); });
    btn.addEventListener('pointermove', function (ev) { if (timer && (Math.abs(ev.clientX - x0) > 10 || Math.abs(ev.clientY - y0) > 10)) parar(); });
    btn.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    btn.addEventListener('click', function (ev) { if (disparado) { disparado = false; ev.stopImmediatePropagation(); ev.preventDefault(); } }, true);
  }

  // ── Más de 8 horas con el mismo dispositivo o máquina ─────────────────────
  // Aviso llamativo en los cuadros y en Ahora para todos, y lectura obligatoria (hay que pulsar «Enterado») para los jefes
  // (con el PIN puesto) y para quien lo tiene. Cada «Enterado» vale 4 horas por dispositivo y toma de posesión.
  var LIMITE_H = 8, LIMITE_MS = LIMITE_H * 3600000, RELEER_MS = 4 * 3600000;
  function excesos() {
    if (S.error) return [];       // sin conexión se ven datos viejos: no se da una alarma que quizá ya no valga
    var t = ahora();
    return ((S.est && S.est.dispositivos) || []).filter(function (d) { return d.activo && d.tiene && d.desde; })
      .map(function (d) { var desde = new Date(d.desde).getTime(); return { d: d, desde: desde, ms: t - desde }; })
      .filter(function (x) { return x.ms >= LIMITE_MS; })
      .sort(function (a, b) { return b.ms - a.ms; });
  }
  function leidosExceso() { try { var j = JSON.parse(lsGet('rd_excesos') || '{}'); return j && typeof j === 'object' ? j : {}; } catch (e) { return {}; } }
  function claveExceso(x) { return x.d.id + '|' + x.d.desde; }
  function tituloExceso(items) {
    return items.length === 1 ? 'Más de ' + LIMITE_H + ' horas sin devolver' : items.length + ' llevan más de ' + LIMITE_H + ' horas sin devolver';
  }
  function mostrarExcesos(items, o) {
    o = o || {};
    var cab = h('div', { class: 'exceso-cab' }, [ic('alerta'), h('h3', { text: tituloExceso(items) }),
      h('p', { text: o.propio ? 'Devuélvelo en cuanto puedas: otra persona puede necesitarlo.' : 'Habla con quien lo tiene y asegúrate de que lo devuelve.' })]);
    var cuerpo = h('div', { class: 'exceso-lista' }, items.map(function (x) {
      return h('div', { class: 'exceso-item' }, [
        h('div', { class: 'exceso-quien', text: x.d.tiene }),
        h('div', { class: 'exceso-disp', text: x.d.nombre }),
        h('div', { class: 'exceso-tiempo' }, [ic('reloj'), 'Lleva ' + duracion(x.ms) + ' · desde ' + cuando(x.desde)])
      ]);
    }));
    abrirModal({
      titulo: tituloExceso(items), cabecera: cab, clase: 'kmodal-exceso', largo: true, obligatorio: !o.voluntario, cuerpo: cuerpo,
      botones: [{
        texto: o.voluntario ? 'Cerrar' : 'Enterado', icono: 'check', clase: o.voluntario ? 'borde' : '',
        accion: function (m) {
          if (!o.voluntario) {
            var l = leidosExceso(), ahoraMs = Date.now(), nuevo = {};
            Object.keys(l).forEach(function (k) { if (ahoraMs - l[k] < RELEER_MS) nuevo[k] = l[k]; });
            items.forEach(function (x) { nuevo[claveExceso(x)] = ahoraMs; });
            lsSet('rd_excesos', JSON.stringify(nuevo));
          }
          m.cerrar();
        }
      }],
      enfoque: function () { return cuerpo; }
    });
  }
  function revisarExcesos() {
    if (!S.clave || !S.est) return;

    if (S.modal) return;
    var todos = excesos();
    if (!todos.length) return;
    var jefe = desbloqueado();
    var mios = jefe ? todos : todos.filter(function (x) { return S.yo && norm(x.d.tiene) === norm(S.yo); });
    var l = leidosExceso(), ahoraMs = Date.now();
    var pend = mios.filter(function (x) { var t = l[claveExceso(x)]; return !(t && ahoraMs - t < RELEER_MS); });
    if (pend.length) mostrarExcesos(pend, { propio: !jefe });
  }

  function confirmarModal(titulo, texto, textoOk, peligro) {

        ]

  // La clave puede llegar suelta o dentro del enlace entero pegado; se quitan espacios, saltos y caracteres invisibles
  // (y, si venía de un enlace, el punto o la coma con que a veces lo cierra un chat).
  function limpiarClave(texto) {
    var t = String(texto == null ? '' : texto).replace(/[\u200B-\u200D\u2060\uFEFF\u00A0]/g, ' ').trim();
    var m = /[?&]k=([^&#\s]+)/.exec(t);
    if (m) {
      try { t = decodeURIComponent(m[1]); } catch (e) { t = m[1]; }
      t = t.replace(/^["'“”‘’«»<>(]+|["'“”‘’«»<>).,;:!]+$/g, '');
    }
    return t.trim();
  }

  function elegirPersona(o) {
    var personas = S.est.personas.filter(function (p) { return p.activo && !(o.excluir || []).some(function (n) { return norm(n) === norm(p.nombre); }); });

    if (!personas.length) {

      cuerpo.appendChild(tit); cuerpo.appendChild(rej);
    });
    var nota = h('input', { type: 'text', id: 'notaMov', maxlength: '200', placeholder: o.notaPlaceholder || 'Nota (opcional)', autocomplete: 'off' });
    cuerpo.appendChild(h('div', { class: 'grupo-campo' }, [h('label', { class: 'campo', for: 'notaMov', text: o.notaEtiqueta || 'Nota' }), nota]));
    if (o.disp) {
      var extra = [h('button', { type: 'button', class: 'btn mini borde', onclick: function () { m.cerrar(); accionAvisar(o.disp); } }, [ic('alerta'), 'Avisar de un problema'])];
      if (desbloqueado() && !o.disp.fuera) extra.push(h('button', { type: 'button', class: 'btn mini borde', onclick: function () { m.cerrar(); accionFuera(o.disp); } }, [ic('ban'), 'Fuera de servicio']));
      cuerpo.appendChild(h('div', { class: 'fila-botones', style: 'margin:0 0 8px;justify-content:flex-start' }, extra));
    }

    function aplicarFiltro() {
      var q = norm(filtro ? filtro.value : '');
      secciones.forEach(function (s) {
        var visibles = 0;
        s.botones.forEach(function (x) { var ok = !q || x.b.dataset.nombre.indexOf(q) !== -1; x.b.classList.toggle('oculto', !ok); if (ok) visibles++; });
        s.tit.classList.toggle('oculto', !visibles); s.rej.classList.toggle('oculto', !visibles);
      });
    }
    function elegir(nombre) {
      elegido = nombre;
      botonesPersona.forEach(function (x) { var on = x.p.nombre === nombre; x.b.classList.toggle('activo', on); x.b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
      principal.el.disabled = false;
      principal.el.lastChild.textContent = o.boton(nombre);
    }

    var principal = {
      texto: o.textoElegir || 'Elige quién eres', clase: '', icono: o.icono, deshabilitado: function () { return !elegido; },
      accion: function (m) {
        if (!elegido) return;

        m.error('');
        m.ocupar(true);
        var texto = principal.el.lastChild.textContent;
        principal.el.lastChild.textContent = 'Guardando…';
        o.enviar(elegido, nota.value.trim()).then(function (r) {

            m.error(r.error || 'No se ha podido guardar.');

          m.cerrar();
          pintarTodo();
          if (r && r.encolado) toast('Sin conexión: apuntado en este aparato. Se enviará solo cuando vuelva la cobertura.', 'aviso');
          else if (o.hecho) toast(o.hecho(elegido, r), 'ok');
          if (o.cartel && !(r && r.ya)) cartel(o.cartel);
        }).catch(function (e) {
          if (silencio(e)) return;
          m.ocupar(false); principal.el.lastChild.textContent = texto;
          m.error(msgError(e));
        });
      }

  // ── Estados: operativo, con fallo, averiado, en reparación y baja (se reflejan también en Centinela) ──
  var ESTADOS = {
    operativo:  { nombre: 'Operativo',     icono: 'check',    texto: 'Funciona bien. Se puede coger.' },
    fallo:      { nombre: 'Con fallo',     icono: 'alerta',   texto: 'Tiene un fallo leve. Se puede coger, pero sale un aviso.' },
    averiado:   { nombre: 'Averiado',      icono: 'ban',      texto: 'Está averiado. No se puede coger hasta que vuelva a estar operativo.' },
    reparacion: { nombre: 'En reparación', icono: 'llave',    texto: 'Se está arreglando o revisando. No se puede coger.' },
    baja:       { nombre: 'Baja',          icono: 'papelera', texto: 'Ya no se usa: desaparece de las listas (el historial se conserva).' }
  };
  function estadoDe(d) { return d.estado || (d.fuera ? 'averiado' : 'operativo'); }
  function estadosDe(d) { return d.grupo === 'Máquina' ? ['operativo', 'fallo', 'averiado', 'reparacion'] : ['operativo', 'averiado', 'reparacion', 'baja']; }
  function mayuscula1(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function textoEstadoFuera(d) { return d.estado === 'averiado' ? 'averiado' : d.estado === 'reparacion' ? 'en reparación' : 'fuera de servicio'; }
  function etiquetaFuera(d) { return d.estado === 'averiado' ? 'AVERIADO' : d.estado === 'reparacion' ? 'EN REPARACIÓN' : 'FUERA DE SERVICIO'; }

  // pulsación larga sobre un cuadro (o el botón «Estado»): elegir el nuevo estado. Pide el PIN de jefes.
  function menuEstado(d) {
    if (!desbloqueado()) { S.pin = null; pedirPin(function () { menuEstado(d); }); return; }
    var actual = estadoDe(d);
    var lista = h('div', { class: 'lista-estados', role: 'group', 'aria-label': 'Estado de ' + d.nombre }, estadosDe(d).map(function (e) {
      var inf = ESTADOS[e];
      return h('button', { type: 'button', class: 'op-estado ' + e + (e === actual ? ' actual' : ''), 'aria-pressed': e === actual ? 'true' : 'false',
        disabled: e === 'operativo' && actual === 'operativo',
        onclick: function () { cerrarModal(); accionEstado(d, e); } },
        [ic(inf.icono), h('div', null, [h('b', { text: inf.nombre + (e === actual ? ' · ahora' : '') }), h('span', { text: inf.texto })])]);
    }));
    var cuerpo = [];
    if (actual !== 'operativo' && d.estado_nota) cuerpo.push(h('div', { class: 'aviso-modal', text: ESTADOS[actual].nombre + (d.estado_desde ? ' desde ' + cuando(new Date(d.estado_desde).getTime()) : '') + ': ' + d.estado_nota }));
    if (d.tiene) cuerpo.push(h('div', { class: 'aviso-modal info', text: 'Lo tiene ' + d.tiene + ' desde ' + cuando(new Date(d.desde).getTime()) + '.' }));
    if (d.pendiente_cs) cuerpo.push(h('div', { class: 'aviso-modal info', text: 'Pendiente de reflejar en Centinela: se actualiza solo en unos minutos.' }));
    cuerpo.push(lista);
    abrirModal({
      titulo: 'Estado de ' + d.nombre, sub: d.grupo + (d.serie ? ' · ' + d.serie : '') + (d.enlazado ? ' · se refleja en Centinela' : ''),
      cuerpo: h('div', null, cuerpo), botones: [{ texto: 'Cerrar', clase: 'borde', accion: function (m) { m.cerrar(); } }]
    });
  }

  function accionEstado(d, e) {
    var inf = ESTADOS[e];
    var pideNota = e === 'fallo' || e === 'averiado' || e === 'reparacion';
    elegirPersona({
      titulo: e === 'operativo' ? 'Volver a ponerlo operativo' : 'Marcar «' + inf.nombre + '»', sub: d.nombre, icono: inf.icono, pre: S.yo,
      aviso: inf.texto + (d.tiene && e === 'baja' ? ' Lo tiene ' + d.tiene + ': se anotará que lo deja.' : '') + (d.enlazado ? ' Se refleja también en Centinela.' : ''), avisoClase: 'info',
      boton: function (p) { return inf.nombre + ' (lo marca ' + p + ')'; },
      notaEtiqueta: e === 'operativo' ? 'Qué se ha hecho' : pideNota ? 'Qué le pasa' : 'Motivo',
      notaPlaceholder: e === 'operativo' ? 'Opcional: cambiadas las pastillas, revisado por el SAT…' : pideNota ? 'Ej.: frena mal, pantalla rota, esperando al SAT…' : 'Opcional: obsoleto, perdido…',
      notaObligatoria: pideNota,
      enviar: function (p, nota) { return llamar('cambiar_estado', { dispositivo_id: d.id, persona: p, estado: e, nota: nota }); },
      hecho: function (p, r) { return (r && r.ya) ? d.nombre + ' ya estaba así' : d.nombre + ': ' + inf.nombre.toLowerCase() + (d.enlazado ? ' · Centinela se actualiza solo' : ''); }
    });
  }

  // ── Cierre de turno: lo que sigue sin devolver cuando termina el turno ────
  // Sale solo (una vez por turno y aparato) en la última media hora del turno y la siguiente, y siempre se puede abrir
  // desde el botón de «Ahora». En el aviso automático solo cuenta lo que se cogió antes de que acabara el turno.
  var CIERRES = [
    { id: 'M', nombre: 'mañana', fin: '14:00', finMin: 14 * 60, desde: 13 * 60 + 30, hasta: 14 * 60 + 30 },
    { id: 'T', nombre: 'tarde', fin: '22:00', finMin: 22 * 60, desde: 21 * 60 + 30, hasta: 22 * 60 + 30 }
  ];
  function minutosMadrid(ms) { var p = fmtHora.format(new Date(ms)).split(':'); return (+p[0]) * 60 + (+p[1]); }
  function cierreActual() {
    var m = minutosMadrid(ahora());
    return CIERRES.filter(function (c) { return m >= c.desde && m < c.hasta; })[0] || null;
  }
  function claveCierre(c) { return diaISO(ahora()) + '|' + c.id; }
  function finDeCierre(c) { return ahora() - (minutosMadrid(ahora()) - c.finMin) * 60000; }
  function pendientesCierre(c) {
    var lim = c ? finDeCierre(c) : null;
    return ((S.est && S.est.dispositivos) || [])
      .filter(function (d) { return d.activo && d.tiene && d.desde && (!lim || new Date(d.desde).getTime() < lim); })
      .sort(function (a, b) {
        var ma = S.yo && norm(a.tiene) === norm(S.yo) ? 0 : 1, mb = S.yo && norm(b.tiene) === norm(S.yo) ? 0 : 1;
        return ma - mb || new Date(a.desde).getTime() - new Date(b.desde).getTime();
      });
  }
  function pintarCierreFila() {
    var f = $('cierreFila');
    if (!f) return;
    vaciar(f);
    var items = pendientesCierre();
    if (!items.length) return;
    var c = cierreActual(), urgente = !!c && lsGet('rd_cierre') !== claveCierre(c);
    f.appendChild(h('button', { type: 'button', class: 'btn mini ancho' + (urgente ? '' : ' borde'), onclick: function () { mostrarCierre(c, {}); } },
      [ic('reloj'), 'Cierre de turno · ' + items.length + ' sin devolver']));
  }
  function mostrarCierre(c, o) {
    o = o || {};
    var items = pendientesCierre(o.auto ? c : null);
    if (!items.length) return;
    if (o.auto) lsSet('rd_cierre', claveCierre(c));
    var cuerpo = h('div', null, items.map(function (d) {
      var desde = new Date(d.desde).getTime();
      var mio = !!S.yo && norm(d.tiene) === norm(S.yo);
      var botones = [h('button', { type: 'button', class: 'btn mini', onclick: function () { accionDejar(d); } }, [ic('devolver'), 'Dejar'])];
      if (!d.fuera) botones.push(h('button', { type: 'button', class: 'btn mini borde', onclick: function () { accionPasar(d); } }, [ic('cambio'), 'Pasar']));
      return h('div', { class: 'cierre-item' + (mio ? ' mio' : '') }, [
        h('div', { class: 'cierre-datos' }, [h('div', { class: 'cierre-nombre', text: d.nombre }),
          h('div', { class: 'cierre-quien', text: d.tiene + ' · lleva ' + duracion(ahora() - desde) + ' (desde ' + cuando(desde) + ')' })]),
        h('div', { class: 'fila-btn-mini' }, botones)
      ]);
    }));
    abrirModal({
      titulo: c ? 'Cierre de turno de ' + c.nombre : 'Lo que sigue sin devolver',
      sub: o.auto ? 'Son las ' + hora(ahora()) + ' y el turno termina a las ' + c.fin + '. Esto sigue sin devolver: déjalo o pásalo a quien siga.'
                  : items.length + (items.length === 1 ? ' sigue' : ' siguen') + ' sin devolver ahora mismo.',
      cuerpo: cuerpo, largo: true,
      botones: [{ texto: 'Cerrar', clase: 'borde', accion: function (m) { m.cerrar(); } }]
    });
  }
  function revisarCierre() {
    if (!S.clave || !S.est || S.error || S.modal) return;
    if (document.querySelector('.cartel')) return;
    var c = cierreActual();
    if (!c || lsGet('rd_cierre') === claveCierre(c)) return;
    if (!pendientesCierre(c).length) return;
    mostrarCierre(c, { auto: true });
  }

  // ── Instalar en el móvil ──────────────────────────────────────────────────
  function esApp() {
    try { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; } catch (e) { return false; }
  }
  function pintarInstalar() {
    var c = $('instalar');
    if (!c) return;
    vaciar(c);
    if (esApp() || lsGet('rd_instalar_no') === '1') return;
    c.appendChild(h('div', { class: 'tarjeta tarjeta-instalar' }, [
      h('div', { class: 'nombre' }, [ic('instalar'), ' Instálala en el móvil']),
      h('p', { class: 'meta', text: 'Se abre como una app, sin escribir el enlace, y si se va la cobertura sigue funcionando: lo que apuntes se envía solo al volver.' }),
      h('div', { class: 'fila-botones' }, [
        h('button', { type: 'button', class: 'btn', onclick: instalarApp }, [ic('instalar'), S.instalarEvt ? 'Instalar' : 'Cómo se instala']),
        h('button', { type: 'button', class: 'btn borde', onclick: function () { lsSet('rd_instalar_no', '1'); pintarInstalar(); } }, ['Ahora no'])
      ])
    ]));

  function instalarApp() {
    if (S.instalarEvt) {
      var ev = S.instalarEvt; S.instalarEvt = null;
      try { ev.prompt(); } catch (e) {}

    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent || '');

      ? ['Abre esta página en Safari.', 'Toca el botón de compartir (el cuadrado con la flecha).', 'Elige «Añadir a pantalla de inicio».', 'La primera vez que abras la app, pega el enlace con la clave si te la pide.']
      : ['Abre esta página en Chrome.', 'Toca el menú (los tres puntos) de arriba a la derecha.', 'Elige «Instalar aplicación» o «Añadir a pantalla de inicio».', 'Si al abrirla te pide la clave, pega el enlace completo que te pasaron.'];
    abrirModal({
      titulo: 'Instalar en el móvil', sub: 'Así se abre como una app y funciona aunque haya poca cobertura.',
      cuerpo: h('ol', { class: 'pasos' }, pasos.map(function (t) { return h('li', { text: t }); })),

    });

  function accionResolver(a) {
    elegirPersona({

  // ── Pestaña «Avisos» (zona de jefes) ──────────────────────────────────────
  function montarAvisos() {
    S.montado = 'avisos';
    var v = vaciar($('vista'));
    v.appendChild(h('div', { class: 'tarjeta' }, [
      h('div', { class: 'nombre', text: 'Avisos de averías y problemas' }),

    ]));

  }

  function botonesAviso(a) {
    var dd = ((S.est && S.est.dispositivos) || []).filter(function (x) { return x.activo && x.nombre === a.dispositivo; })[0];
    return h('div', { class: 'fila-botones', style: 'margin-top:10px' }, [
      h('button', { type: 'button', class: 'btn', onclick: function () { accionResolver(a); } }, [ic('check'), 'Marcar resuelto']),

    ]);
  }

  var avSeq = 0;
  function cargarAvisos() {
    var mi = ++avSeq;
    S.av.listo = false; S.av.error = null; pintarAvisos();
    return llamar('avisos').then(function (r) {
      if (mi !== avSeq) return;
      if (r.ok === false) throw new Error(r.error || 'No se han podido cargar.');
      S.av.todos = r.avisos || []; S.av.listo = true; pintarAvisos();
    }).catch(function (e) {
      if (mi !== avSeq || silencio(e)) return;
      S.av.error = msgError(e); pintarAvisos();
    });
  }

  function pintarAvisos() {
    var cont = $('avisosLista');
    if (!cont || S.tab !== 'avisos') return;
    vaciar(cont);
    if (S.av.error) {
      cont.appendChild(h('div', { class: 'tarjeta borde-mal' }, [h('p', { class: 'meta', text: S.av.error }),
        h('button', { type: 'button', class: 'btn', onclick: cargarAvisos }, [ic('refrescar'), 'Reintentar'])]));
      return;
    }
    if (!S.av.listo) { cont.appendChild(h('div', { class: 'vacio', text: 'Cargando…' })); return; }
    var abiertos = S.av.todos.filter(function (a) { return !a.resuelto; });
    var resueltos = S.av.todos.filter(function (a) { return a.resuelto; });
    cont.appendChild(h('h2', { class: 'titulo-seccion', text: 'Abiertos ' + abiertos.length }));
    if (!abiertos.length) cont.appendChild(h('div', { class: 'vacio', text: 'No hay avisos abiertos.' }));
    abiertos.forEach(function (a) {
      cont.appendChild(h('div', { class: 'tarjeta borde-aviso' }, [
        h('div', { class: 'nombre', text: a.dispositivo }),
        h('p', { class: 'aviso-texto', text: a.texto }),
        h('div', { class: 'meta' }, [ic('reloj'), ' Avisó ' + a.por + ' · ' + cuando(new Date(a.ts).getTime())]),
        botonesAviso(a)
      ]));
    });
    if (resueltos.length) {
      cont.appendChild(h('h2', { class: 'titulo-seccion', text: 'Resueltos recientes' }));
      resueltos.slice(0, 30).forEach(function (a) {
        cont.appendChild(h('div', { class: 'tarjeta borde-ok' }, [

  function editarItem(esDisp, x) {
    var nombre = campoTexto('fNombre', 'Nombre', x ? x.nombre : '', esDisp ? 'Ej.: Retráctil 12' : 'Ej.: Alex Rios', esDisp ? 80 : 60);
    var serie = esDisp ? campoTexto('fSerie', 'Número de serie o código (opcional)', x ? x.serie : '', 'Ej.: R14 / P21120R02353') : null;
    var grupo = campoPicks(esDisp ? 'Tipo' : 'Grupo', esDisp ? GRUPOS_DISP : GRUPOS_PERS, x ? x.grupo : (esDisp ? (S.seccion === 'dispositivos' ? 'Móvil / lector' : 'Máquina') : 'Operario'));
    var cuerpo = h('div', null, [nombre.el, grupo.el, serie ? serie.el : null]);
    abrirModal({
      titulo: (x ? 'Editar ' : 'Añadir ') + (esDisp ? 'dispositivo' : 'persona'), cuerpo: cuerpo, enfoque: function () { return nombre.input; },
      botones: [
        { texto: 'Cancelar', clase: 'borde', accion: function (m) { m.cerrar(); } },
        { texto: 'Guardar', icono: 'check', accion: function (m) {
          var n = nombre.input.value.trim();
          if (!n) { m.error('Falta el nombre.'); nombre.input.focus(); return; }
          m.error(''); m.ocupar(true);
          var args = { id: x ? x.id : undefined, nombre: n, grupo: grupo.valor() };
          if (esDisp) args.serie = serie.input.value.trim();
          llamar(esDisp ? 'guardar_dispositivo' : 'guardar_persona', args).then(function (r) {
            m.ocupar(false);
            if (r.ok === false) { m.error(r.error); return; }
            aplicarEstado(r); m.cerrar(); pintarTodo(); toast('Guardado', 'ok');
          }).catch(function (e) { m.ocupar(false); if (!silencio(e)) m.error(msgError(e)); });
        } }
      ]
    });
  }

  function archivarItem(esDisp, x, activo) {
    var ir = function () {
      llamar(esDisp ? 'archivar_dispositivo' : 'archivar_persona', { id: x.id, activo: activo }).then(function (r) {
        if (r.ok === false) { toast(r.error, 'mal'); return; }
        aplicarEstado(r); pintarTodo(); toast(activo ? 'Recuperado' : 'Archivado (el historial se conserva)', 'ok');
      }).catch(function (e) { if (!silencio(e)) toast(msgError(e), 'mal'); });
    };
    if (activo) { ir(); return; }
    confirmarModal('Archivar «' + x.nombre + '»', 'Deja de salir en las listas, pero su historial se conserva. Se puede recuperar cuando quieras.', 'Archivar', true).then(function (si) { if (si) ir(); });
  }

  function importarItems(esDisp) {
    var ayuda = esDisp
      ? 'Una línea por dispositivo: Nombre ; Tipo ; Serie. El tipo y la serie son opcionales (Tipo: Máquina, Móvil / lector, Ordenador, Impresora, Otro). Vale pegar columnas copiadas de una hoja de cálculo.'
      : 'Una línea por persona: Nombre ; Grupo. El grupo es opcional (Jefe, Operario, Otro). Vale pegar columnas copiadas de una hoja de cálculo.';
    var area = h('textarea', { id: 'impTexto', placeholder: esDisp ? 'Retráctil 12 ; Máquina ; R14 / P21120R02301\nWyse recepción ; Ordenador ; GTZWT93' : 'Alex Rios ; Operario\nDani Simo ; Jefe', spellcheck: 'false' });
    var resumen = h('div', { class: 'meta', style: 'margin-bottom:8px', text: '0 líneas' });
    function parsear() {
      var out = [];
      area.value.split(/\r?\n/).forEach(function (l) {
        if (!l.trim()) return;
        var c = (l.indexOf('\t') !== -1 ? l.split('\t') : l.split(';')).map(function (s) { return s.replace(/^\s*"?|"?\s*$/g, ''); });
        if (!c[0] || norm(c[0]) === 'nombre') return;
        out.push(esDisp ? { nombre: c[0], grupo: c[1] || '', serie: c[2] || '' } : { nombre: c[0], grupo: c[1] || '' });
      });
      return out;
    }
    area.addEventListener('input', function () { var n = parsear().length; resumen.textContent = n + (n === 1 ? ' línea' : ' líneas'); });
    abrirModal({
      titulo: 'Importar ' + (esDisp ? 'dispositivos' : 'personas'), sub: ayuda, largo: true,
      cuerpo: h('div', null, [h('div', { class: 'grupo-campo' }, [h('label', { class: 'campo', for: 'impTexto', text: 'Lista' }), area]), resumen,
        h('div', { class: 'meta', text: 'Los que ya existen (mismo nombre) no se tocan.' })]),
      enfoque: function () { return area; },
      botones: [
        { texto: 'Cancelar', clase: 'borde', accion: function (m) { m.cerrar(); } },
        { texto: 'Importar', icono: 'check', accion: function (m) {
          var lineas = parsear();
          if (!lineas.length) { m.error('Pega al menos una línea.'); return; }
          if (lineas.length > 500) { m.error('Máximo 500 líneas cada vez.'); return; }
          m.error(''); m.ocupar(true);
          llamar(esDisp ? 'importar_dispositivos' : 'importar_personas', { lineas: lineas }).then(function (r) {
            m.ocupar(false);
            if (r.ok === false) { m.error(r.error); return; }
            aplicarEstado(r); m.cerrar(); pintarTodo();
            toast(r.nuevos + ' nuevos' + (r.existentes ? ', ' + r.existentes + ' ya estaban' : ''), 'ok');
          }).catch(function (e) { m.ocupar(false); if (!silencio(e)) m.error(msgError(e)); });
        } }
      ]
    });
  }

  function ajustesOtros(v) {
    var modo = document.documentElement.getAttribute('data-kmode'), tema = document.documentElement.getAttribute('data-ktheme');
    var picksModo = h('div', { class: 'fila-picks' }, [['dark', 'Oscuro'], ['light', 'Claro']].map(function (m) {
      return h('button', { type: 'button', class: 'pick', 'aria-pressed': modo === m[0] ? 'true' : 'false', onclick: function () { setModo(m[0]); montarAjustes(); } }, [m[1]]);
    }));
    var nombresTema = { indigo: 'Índigo', lmgreen: 'Verde LM', taisared: 'Rojo Taisa', amber: 'Ámbar', retro80s: 'Fresh Prince' };
    var picksTema = h('div', { class: 'fila-picks' }, Object.keys(TEMAS_MODOS).filter(function (t) { return TEMAS_MODOS[t].indexOf(modo) !== -1; }).map(function (t) {
      return h('button', { type: 'button', class: 'pick', 'data-for': t, 'aria-pressed': tema === t ? 'true' : 'false', onclick: function () { setTema(t); montarAjustes(); } }, [h('span', { class: 'dot' }), nombresTema[t]]);
    }));
    v.appendChild(h('div', { class: 'tarjeta' }, [
      h('div', { class: 'nombre', text: 'Apariencia' }), h('p', { class: 'meta', text: 'Se guarda en este aparato.' }),
      h('div', { class: 'grupo-campo' }, [h('div', { class: 'campo', text: 'Modo' }), picksModo]),
      h('div', { class: 'grupo-campo', style: 'margin-bottom:0' }, [h('div', { class: 'campo', text: 'Acento' }), picksTema])
    ]));
    v.appendChild(h('div', { class: 'tarjeta' }, [
      h('div', { class: 'nombre', text: 'Acceso' }),
      h('p', { class: 'meta', text: 'Quien tenga el enlace con la clave puede ver y apuntar. Si cambias la clave, hay que pasar el enlace nuevo a todos.' }),
      h('div', { class: 'fila-botones' }, [
        h('button', { type: 'button', class: 'btn borde', onclick: cambiarClave }, [ic('llave'), 'Cambiar la clave']),
        h('button', { type: 'button', class: 'btn borde', onclick: function () {
          confirmarModal('Salir en este aparato', 'Se olvida la clave en este móvil u ordenador. Para volver a entrar hará falta el enlace con la clave.', 'Salir', true).then(function (si) {
            if (si) { S.clave = null; S.est = null; lsSet('rd_clave', null); lsSet('rd_yo', null); S.yo = ''; pantallaAcceso(''); }
          });
        } }, [ic('salir'), 'Salir de este aparato'])
      ])
    ]));
    v.appendChild(h('div', { class: 'tarjeta' }, [
      h('div', { class: 'nombre', text: 'PIN de jefes' }),
      h('p', { class: 'meta', text: conPin()
        ? 'Los Avisos, el Historial y los Ajustes piden un PIN de 4 números. Se bloquean solos tras 10 minutos sin tocar nada.'
        : 'Todavía no hay PIN: cualquiera con el enlace ve el Historial y los Ajustes. Pon uno de 4 números.' }),
      h('div', { class: 'fila-botones' }, [h('button', { type: 'button', class: 'btn borde', onclick: cambiarPin }, [ic('candado'), conPin() ? 'Cambiar el PIN' : 'Poner un PIN'])])
    ]));
    v.appendChild(h('div', { class: 'tarjeta' }, [
      h('div', { class: 'nombre', text: 'Cómo funciona' }),
      h('p', { class: 'meta', text: 'Coger y Dejar apuntan quién, qué y cuándo. Si algo lleva cogido desde un día anterior sale en ámbar: puede que se haya olvidado de dejarse. Con «Avisar de un problema» se deja un aviso que ven los jefes y quien coja después. Los dispositivos y personas archivados no salen en las listas, pero su historial se conserva.' })
    ]));
  }

  function cambiarPin() {
    function campoPin(id) { return h('input', { type: 'password', id: id, inputmode: 'numeric', pattern: '[0-9]*', maxlength: '4', autocomplete: 'off', class: 'pin-campo', placeholder: '••••' }); }
    var p1 = campoPin('pn1'), p2 = campoPin('pn2');
    [p1, p2].forEach(function (c) { c.addEventListener('input', function () { c.value = c.value.replace(/[^0-9]/g, '').slice(0, 4); }); });
    abrirModal({
      titulo: conPin() ? 'Cambiar el PIN' : 'Poner un PIN', sub: '4 números. Es el que usan los jefes para ver Avisos, Historial y Ajustes.',
      cuerpo: h('div', null, [
        h('div', { class: 'grupo-campo' }, [h('label', { class: 'campo', for: 'pn1', text: 'PIN nuevo' }), p1]),
        h('div', { class: 'grupo-campo' }, [h('label', { class: 'campo', for: 'pn2', text: 'Repítelo' }), p2])
      ]),
      enfoque: function () { return p1; },
      botones: [
        { texto: 'Cancelar', clase: 'borde', accion: function (m) { m.cerrar(); } },
        { texto: 'Guardar', icono: 'check', accion: function (m) {
          if (!/^[0-9]{4}$/.test(p1.value)) { m.error('Tienen que ser 4 números.'); return; }
          if (p1.value !== p2.value) { m.error('No coinciden.'); return; }
          m.error(''); m.ocupar(true);
          llamar('cambiar_pin', { nueva: p1.value }).then(function (r) {
            m.ocupar(false);
            if (r.ok === false) { m.error(r.error); return; }
            aplicarEstado(r);
            S.pin = p1.value; S.pinTs = Date.now();
            m.cerrar(); pintarTabs(); montarAjustes(); toast('PIN guardado. Díselo solo a quien deba entrar.', 'ok');
          }).catch(function (e) { m.ocupar(false); if (!silencio(e)) m.error(msgError(e)); });
        } }
      ]
    });
  }

  function cambiarClave() {
    var n1 = h('input', { type: 'password', id: 'ck1', autocomplete: 'new-password', autocapitalize: 'off', spellcheck: 'false' });
    var n2 = h('input', { type: 'password', id: 'ck2', autocomplete: 'new-password', autocapitalize: 'off', spellcheck: 'false' });
    abrirModal({
      titulo: 'Cambiar la clave', sub: 'Entre 8 y 64 caracteres. Al cambiarla, los enlaces anteriores dejan de valer.',
      cuerpo: h('div', null, [
        h('div', { class: 'grupo-campo' }, [h('label', { class: 'campo', for: 'ck1', text: 'Clave nueva' }), n1]),
        h('div', { class: 'grupo-campo' }, [h('label', { class: 'campo', for: 'ck2', text: 'Repítela' }), n2])
      ]),
      enfoque: function () { return n1; },
      botones: [
        { texto: 'Cancelar', clase: 'borde', accion: function (m) { m.cerrar(); } },
        { texto: 'Cambiar', icono: 'check', accion: function (m) {
          if (n1.value.length < 8) { m.error('Mínimo 8 caracteres.'); return; }
          if (n1.value !== n2.value) { m.error('No coinciden.'); return; }
          m.error(''); m.ocupar(true);
          llamar('cambiar_clave', { nueva: n1.value }).then(function (r) {
            m.ocupar(false);
            if (r.ok === false) { m.error(r.error); return; }
            S.clave = n1.value; lsSet('rd_clave', n1.value);
            m.cerrar(); toast('Clave cambiada. Pasa el enlace nuevo a los demás.', 'ok');
          }).catch(function (e) { m.ocupar(false); if (!silencio(e)) m.error(msgError(e)); });
        } }
      ]
    });
  }

  // ── Tema ──────────────────────────────────────────────────────────────────
  function setModo(modo) {
    var tema = document.documentElement.getAttribute('data-ktheme');
    document.documentElement.setAttribute('data-kmode', modo); lsSet('taisa_mode_pick', modo);
    if (TEMAS_MODOS[tema].indexOf(modo) === -1) setTema('taisared');
  }
  function setTema(t) { document.documentElement.setAttribute('data-ktheme', t); lsSet('taisa_theme_pick', t); }

  // ── Arranque ──────────────────────────────────────────────────────────────
  function arrancar() {
    // app instalable y con la pantalla guardada para abrir sin cobertura
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
    window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); S.instalarEvt = ev; pintarInstalar(); });
    window.addEventListener('appinstalled', function () { S.instalarEvt = null; lsSet('rd_instalar_no', '1'); pintarInstalar(); });
    window.addEventListener('online', function () { if (S.clave && !S.modal) cargarEstado(true); });
    var k = null;
    try { k = new URLSearchParams(location.search).get('k'); } catch (e) {}
    k = k ? limpiarClave(k) : null;
    if (k) {
      lsSet('rd_clave', k);
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}   // que la clave no se quede en la barra
    }
    S.clave = k || lsGet('rd_clave');
    if (!S.clave) { pantallaAcceso(''); return; }
    pintarCabecera(); pintarTabs();
    vaciar($('vista')).appendChild(h('div', { class: 'vacio', text: 'Cargando…' }));
    cargarEstado(false);

    S.temporizador = setInterval(function () {
      if (document.visibilityState !== 'visible' || !S.clave || S.modal || S.cargando) return;
      if (S.tab === 'ahora') cargarEstado(true);
    }, REFRESCO_MS);
    setInterval(function () {
      if (S.pin && !S.modal && Date.now() - S.pinTs > PIN_REPOSO_MS) bloquear('');
    }, 15000);
    setInterval(function () {      // lo apuntado sin conexión se reintenta solo
      if (document.visibilityState !== 'visible' || !S.clave || cola.enviando || !leerCola().length) return;
      vaciarCola().then(function (ok) { if (ok && !leerCola().length) cargarEstado(true); });
    }, 20000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && S.clave && !S.modal && Date.now() - S.ultima > 20000) cargarEstado(true);
    });
  }

  window.__registro = { estado: S, pintar: function () { pintarTodo(); }, revisarCierre: function () { revisarCierre(); } };     // solo para las pruebas
  arrancar();
})();
</script>
</body>
</html>
